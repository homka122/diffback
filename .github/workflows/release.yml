name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Publishing steps are skipped until these repository secrets exist.
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run package
      - name: Attach the VSIX to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: extension/diffback.vsix
          generate_release_notes: true
      - name: Publish to the VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: bunx vsce publish --packagePath diffback.vsix
      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: bunx ovsx publish diffback.vsix
